<!DOCTYPE html>
<html lang="zh-Hans-cn" color-scheme="dark">
    <head>
        <!--
                ___    __                   __  __    
               /   |  / /_  ____  __  __   / / / /  __
              / /| | / __ \/ __ \/ / / /  / /_/ / |/_/
             / ___ |/ / / / /_/ / /_/ /  / __  />  <  
            /_/  |_/_/ /_/\____/\__,_/  /_/ /_/_/|_|  
        -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ahou</title>
        <meta name="description" content="ahou">
        <meta name="keywords" content="ahou">
        <meta name="author" content="yangko">
        <meta name="license" href="/LICENSE">
        <link rel="preload" type="text/css" href="/src/styles/style.css" as="style">
        <link rel="modulepreload" type="module" href="./src/scripts/script.mjs" as="script">
        <link rel="stylesheet" type="text/css" href="./src/styles/style.css">
        <link rel="icon" type="image/svg+xml" href="/src/assets/images/icon.svg">
    </head>
    <body>
        <ahou>
            <header>
                <div style="display:flex;align-items:center;gap:1em;">
                    <ahou-icon/>
                </div>
                <div id="header-time" style="min-width:6em;text-align:right;"></div>
            </header>

            <main>
            <button id="create-process-btn" style="position:fixed;top:60px;left:16px;z-index:300;">新建进程窗口</button>



                <app data-app="{name:'example'}">
                    <app-head>
                        <img src="/src/assets/images/icon.svg" alt>
                        <span>Example</span>
                        <control>
                            <min></min>
                            <max></max>
                            <exit></exit>
                        </control>
                    </app-head>
                    <app-body>
                        <img src="/src/assets/images/pzx.png" alt>
                        <p>朴正熙大统领</p>
                    </app-body>
                </app>


            </main>
            <div id="taskbar" style="position:fixed;left:0;right:0;bottom:0;height:40px;background:rgba(30,34,50,0.92);z-index:10000;display:flex;align-items:center;gap:8px;padding:0 16px;box-shadow:0 -2px 8px #0004;">
                <!-- 窗口列表由js动态填充 -->
            </div>
            <footer></footer>
        </ahou>
        <audio id="bg-music" src="./src/assets/audios/M5000011gNMw3KpHdx.mp3" autoplay loop preload="auto" style="position:fixed;left:-9999px;" volume="0.3"></audio>
        <script type="module" src="/src/scripts/script.mjs"></script>
        <script type="text/javascript" src="/src/scripts/window.js"></script>
        <script type="text/javascript" src="/src/scripts/task.js"></script>
        <script type="text/javascript" src="/src/scripts/init.js"></script>
        <script type="text/javascript" src="/src/scripts/storage.js"></script>
        <script type="text/javascript" src="/src/scripts/resize.js"></script>
        <script>
        // 自动播放兼容处理
        window.addEventListener('DOMContentLoaded', function() {
          var audio = document.getElementById('bg-music');
          if (audio) {
            audio.volume = 0.3;
            // 兼容浏览器自动播放策略
            var play = () => { audio.play().catch(()=>{}); };
            document.body.addEventListener('click', play, { once: true });
            document.body.addEventListener('keydown', play, { once: true });
          }
        });

        // 简单任务栏窗口列表渲染
        function renderTaskbar() {
            const bar = document.getElementById('taskbar');
            if (!bar) return;
            const apps = Array.from(document.querySelectorAll('app'));
            bar.innerHTML = '';
            apps.forEach((app, i) => {
                const title = app.querySelector('app-head span')?.textContent || '窗口'+(i+1);
                const icon = app.querySelector('app-head img')?.getAttribute('src') || '/src/assets/images/icon.svg';
                const btn = document.createElement('button');
                btn.innerHTML = `<img src="${icon}"><span>${title}</span>`;
                btn.title = title;
                btn.style.marginRight = '8px';
                btn.onclick = () => {
                    if (window.WindowApp && app.WindowAppInstance) app.WindowAppInstance.bringToFront();
                    app.style.display = '';
                    app.focus();
                };
                bar.appendChild(btn);
            });
        }
        window.renderTaskbar = renderTaskbar;
        // 监听app变化自动刷新任务栏
        const main = document.querySelector('main');
        if (main && window.MutationObserver) {
            new MutationObserver(renderTaskbar).observe(main, { childList: true, subtree: true });
        }
        document.addEventListener('DOMContentLoaded', renderTaskbar);
        </script>
    </body>
</html>
